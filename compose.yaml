name: pixora

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pixora}
      POSTGRES_USER: ${DB_USER:-pixora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-insecure-db-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: pixora-backend:1.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-secret-key}
      DEBUG: ${DEBUG:-False}
      USE_SQLITE: "False"
      DB_NAME: ${DB_NAME:-pixora}
      DB_USER: ${DB_USER:-pixora}
      DB_PASSWORD: ${DB_PASSWORD:-insecure-db-password}
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-5}
    ports:
      - "127.0.0.1:${PIX_BACKEND_PORT:-8000}:8000"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    image: pixora-frontend:1.0.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PIX_FRONTEND_PORT:-4200}:8080"
    volumes:
      - media:/var/www/media:ro
      - static:/var/www/static:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  media:
  static:

networks:
  frontend:
  backend:
