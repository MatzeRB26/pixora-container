server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bild-Uploads bis 10 MB erlauben
    client_max_body_size 10m;

    # API und Django-Admin an das Backend weiterleiten
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Files von Django (Admin-Styles)
    location /static/ {
        alias /var/www/static/;
    }

    # Hochgeladene Bilder
    location /media/ {
        alias /var/www/media/;
    }

    # Angular-Routing: unbekannte Pfade auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
