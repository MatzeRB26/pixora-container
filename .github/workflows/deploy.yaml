name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }} to VM
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Ensure a Git tag was selected
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Deployments are only allowed for Git tags. Choose a tag under 'Use workflow from'."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Git tag '$TAG' is not a valid image tag"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy compose file and deploy script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: scp -o StrictHostKeyChecking=yes compose.yaml deploy/deploy.sh "${SSH_USER}@${SSH_HOST}:/opt/pixora/"

      - name: Run deployment on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          TAG: ${{ github.ref_name }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" \
            bash /opt/pixora/deploy.sh "$TAG" "$SSH_HOST" "$GHCR_USER"

      - name: Smoke test from outside
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "http://${SSH_HOST}:4200/api/health/"
          curl -fsS -o /dev/null "http://${SSH_HOST}:4200/"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
